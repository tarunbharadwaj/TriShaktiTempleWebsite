  <rect x="92" y="845" width="1016" height="128" rx="36" fill="#302f86"/>
  <text x="600" y="905" text-anchor="middle" font-family="system-ui,sans-serif" font-size="37" font-weight="750" fill="#fff">11–20 OCTOBER 2026</text>
  <text x="600" y="950" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" font-weight="600" fill="#f8d96f">TEN DAYS OF DUSSEHRA CELEBRATIONS</text>
  <g transform="translate(90 1020)">
    <rect width="1020" height="390" rx="38" fill="#fff8ea" opacity=".97"/>
    <text x="510" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="38" font-weight="850" fill="#8e251e">DAILY WORSHIP · ALANKARANA · ANNADANAM</text>
    <path d="M80 112h860" stroke="#d7a83d" stroke-width="3"/>
