<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Festival highlights</title><desc id="desc">Decorative announcement for the 2026 Dussehra festival.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8df"/><stop offset=".45" stop-color="#f7c968"/><stop offset="1" stop-color="#a42b22"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#fff8c4"/><stop offset="1" stop-color="#f4c45d" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".18"/></filter>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#fff" opacity=".25"/></pattern>
  </defs>
  <rect width="1200" height="1600" rx="36" fill="url(#bg)"/><rect width="1200" height="1600" fill="url(#dots)"/>
  <g fill="#fff4d7" opacity=".85"><path d="M0 0h160l-34 83 34 83H0z"/><path d="M1200 0h-160l34 83-34 83h160z"/></g>
