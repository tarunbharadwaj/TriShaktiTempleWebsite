  <text x="600" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="66" font-weight="900" fill="#991f18">SRI SRI SRI TRISHAKTI</text>
  <text x="600" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="48" font-weight="800" fill="#2c316f">DEVALAYAM</text>
  <text x="600" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="650" fill="#4f473d">Mandir Marg · Ukkunagaram · Visakhapatnam</text>
  <circle cx="600" cy="560" r="250" fill="url(#halo)"/>
  <g transform="translate(600 555)" filter="url(#shadow)">
    <circle r="196" fill="#fff7df" stroke="#b7751b" stroke-width="14"/>
    <circle r="164" fill="#8e251e" stroke="#f0bc46" stroke-width="8"/>
    <path d="M0-126C-25-82-67-47-67 7c0 58 38 104 67 130 29-26 67-72 67-130 0-54-42-89-67-133z" fill="#f4c14f"/>
    <path d="M-116 65c48-20 76-13 116 24-34 37-71 51-116 30 12-16 19-34 0-54zm232 0c-48-20-76-13-116 24 34 37 71 51 116 30-12-16-19-34 0-54z" fill="#f7db86"/>
    <circle cy="-9" r="45" fill="#fff3d6"/><circle cx="-16" cy="-12" r="5" fill="#2a1714"/><circle cx="16" cy="-12" r="5" fill="#2a1714"/>
    <path d="M-18 15q18 15 36 0" fill="none" stroke="#2a1714" stroke-width="5" stroke-linecap="round"/>
    <circle cy="-60" r="9" fill="#e3262e"/>
